<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h2>Login</h2>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="post" action="">
        {% csrf_token %}

        <label for="id_username">Username:</label><br>
        <input type="text" id="id_username" name="username" required><br><br>

        <label for="id_id_number">ID Number:</label><br>
        <input type="text" id="id_id_number" name="id_number" required><br><br>

        <label for="id_password">Password:</label><br>
        <input type="password" id="id_password" name="password" required><br><br>

        <button type="submit">Login</button>
    </form>

</body>
</html>
